name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Backend Pytest Suite with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Code Quality & Syntax Check (Flake8)
        run: |
          # Stop build on Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,__pycache__,dashboard,node_modules
          # Lint warnings with tolerant style flags
          flake8 src/ tests/ --count --max-line-length=120 --extend-ignore=E203,W503,E402,E221,E225,E272,W292,W293,W291,F401,F841 --statistics

  frontend:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "dashboard/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd dashboard
          npm ci --legacy-peer-deps || npm install

      - name: Run Frontend Component Tests
        run: |
          cd dashboard
          npm test -- --watchAll=false

      - name: Build Frontend Production Bundle
        run: |
          cd dashboard
          npm run build
