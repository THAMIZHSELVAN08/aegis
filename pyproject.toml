[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-fdia-smartgrid"
version = "1.0.0"
description = "AEGIS: Real-Time False Data Injection Attack Detection & Resiliency Platform for Smart Grids"
readme = "README.md"
authors = [
    { name = "Thamizhselvan" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["smart-grid", "fdia", "cybersecurity", "machine-learning", "xgboost", "pandapower", "scada"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Energy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "Flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-socketio>=5.3.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandapower>=2.14.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "shap>=0.44.0",
    "xgboost>=2.0.0",
    "paho-mqtt>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.0.0",
]
temporal = [
    "tensorflow>=2.15.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/train_temporal_model.py",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true

[tool.pyright]
extraPaths = ["."]
typeCheckingMode = "basic"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "none"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.vercel]
entrypoint = "app.py"
