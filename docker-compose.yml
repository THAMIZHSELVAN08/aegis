version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - AEGIS_HOST=0.0.0.0
      - PORT=5000
      - CORS_ORIGIN=*
      - LOG_LEVEL=INFO
      - AEGIS_DB_PATH=/app/data/aegis_history.db
    volumes:
      - aegis-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: aegis-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aegis-data:
    name: aegis-data-volume
